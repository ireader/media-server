name: C/C++ CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          path: media-server

      - name: Sdk
        uses: actions/checkout@v2
        with:
          repository: ireader/sdk
          path: sdk
          
      - name: avcodec
        uses: actions/checkout@v2
        with:
          repository: ireader/avcodec
          path: avcodec

      - name: Make
        run: make
        working-directory: media-server

      - name: libmpeg packet regressions
        working-directory: media-server
        run: |
          mpeg_archive="$(find libmpeg -path '*/libmpeg.a' -print -quit)"
          test -n "${mpeg_archive}"
          g++ -std=c++11 -Ilibmpeg/include -Ilibmpeg/source \
            -DMPEG_PACKET_TEST_MAIN -DMPEG_PACKET_INVALID_PES_TEST \
            libmpeg/test/mpeg-packet-test.cpp "${mpeg_archive}" \
            -o /tmp/mpeg-packet-test
          /tmp/mpeg-packet-test

#      - name: Make check
#        run: make test
#        working-directory: media-server
